header:
  version: 14

repos:
  # Orion-Configuration ships its own meta-webconfig Yocto layer (the
  # on-device WebConfig daemon + static frontend + schemas + board
  # manifest). Only that subdirectory is a layer; the rest of the repo
  # (Rust workspace, frontend source) is not needed by the build.
  orion-configuration:
    url: git@github.com:soccentric-orion/Orion-Configuration.git
    branch: develop
    path: meta/orion-configuration
    layers:
      meta-webconfig:
